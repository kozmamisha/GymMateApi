# Local development infrastructure for GymMate.
#
#   docker compose up -d      start
#   docker compose down       stop (data is kept in the named volume)
#   docker compose down -v    stop and delete all data
#
# Requires a .env file next to this one (see .env.example).
# The password here must match the one inside the services' User Secrets:
#   dotnet user-secrets list --project GymMateApi.AuthService
#
# The five per-service databases (gymMate_auth, gymMate_comments, gymMate_courses,
# gymMate_exercises, gymMate_trainings) are NOT created here - EF Core creates each
# one on "dotnet ef database update".

services:
  postgres:
    image: postgres:17-alpine
    container_name: gymmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
